<link rel="manifest" href="data:application/manifest+json,{%22name%22:%22Centralina%22,%22short_name%22:%22Centralina%22,%22display%22:%22standalone%22,%22background_color%22:%22%23181a17%22,%22theme_color%22:%22%23181a17%22,%22start_url%22:%22.%22}">

<style>
  :root{
    --bg:#181a17;
    --panel:#222420;
    --panel-raised:#2b2e28;
    --line:#3a3d35;
    --line-soft:#2f3129;
    --text:#ece8db;
    --text-dim:#9a9c8e;
    --text-faint:#6c6e62;
    --accent:#f2a900;
    --accent-dim:#8a6a1f;
    --ok:#7a9a5c;
    --warn:#f2a900;
    --danger:#c1552e;
    --radius:14px;
    --radius-sm:8px;
    font-size:16px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    overflow-x:hidden;
    -webkit-user-select:none;
    user-select:none;
  }
  .mono{font-family:ui-monospace,'SF Mono','Menlo','Roboto Mono',monospace;}
  input, textarea{-webkit-user-select:text; user-select:text;}
  #app{
    max-width:480px;
    margin:0 auto;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    position:relative;
    background:
      linear-gradient(180deg, rgba(242,169,0,0.05), rgba(242,169,0,0) 140px),
      var(--bg);
  }

  /* Topbar */
  .topbar{
    padding:22px 20px 14px;
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    border-bottom:1px solid var(--line-soft);
  }
  .brand{
    font-weight:700;
    font-size:1.3rem;
    letter-spacing:0.01em;
  }
  .brand span{color:var(--accent);}
  .topdate{
    font-family:ui-monospace,'SF Mono','Menlo','Roboto Mono',monospace;
    font-size:0.78rem;
    color:var(--text-faint);
  }

  /* Views */
  .view{
    flex:1;
    padding:18px 20px 100px;
    display:none;
    animation:fade .25s ease;
  }
  .view.active{display:block;}
  @keyframes fade{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:translateY(0);}}

  h1.page-title{
    font-size:1.05rem;
    font-weight:600;
    margin:4px 0 16px;
    color:var(--text);
  }
  p.hint{
    color:var(--text-dim);
    font-size:0.88rem;
    line-height:1.5;
    margin:0 0 16px;
  }

  /* Day picker grid */
  .day-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-bottom:22px;
  }
  .day-card{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:14px;
    text-align:left;
    cursor:pointer;
    position:relative;
    transition:border-color .15s, background .15s;
  }
  .day-card:active{transform:scale(0.98);}
  .day-card.selected{
    border-color:var(--accent);
    background:linear-gradient(160deg, rgba(242,169,0,0.10), rgba(242,169,0,0.02));
  }
  .day-card .letter{
    font-family:ui-monospace,'SF Mono','Menlo','Roboto Mono',monospace;
    font-size:0.75rem;
    color:var(--accent);
    display:block;
    margin-bottom:6px;
  }
  .day-card .title{
    font-weight:600;
    font-size:0.92rem;
    display:block;
    margin-bottom:4px;
  }
  .day-card .sub{
    color:var(--text-dim);
    font-size:0.76rem;
  }
  .day-card .badge{
    position:absolute;
    top:10px;
    right:10px;
    background:var(--accent);
    color:#1a1a17;
    font-size:0.62rem;
    font-weight:700;
    padding:2px 6px;
    border-radius:20px;
  }

  /* Energy switch */
  .energy-block{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:14px;
    margin-bottom:22px;
  }
  .energy-label{
    font-size:0.82rem;
    color:var(--text-dim);
    margin-bottom:10px;
  }
  .energy-toggle{
    display:grid;
    grid-template-columns:1fr 1fr 1fr;
    background:var(--bg);
    border-radius:10px;
    padding:4px;
    gap:4px;
    border:1px solid var(--line);
  }
  .energy-opt{
    padding:10px 4px;
    text-align:center;
    border-radius:7px;
    font-size:0.76rem;
    font-weight:600;
    color:var(--text-dim);
    cursor:pointer;
    border:1px solid transparent;
  }
  .energy-opt.on[data-e="verde"]{background:rgba(122,154,92,0.18); color:#c3d9ac; border-color:var(--ok);}
  .energy-opt.on[data-e="giallo"]{background:rgba(242,169,0,0.16); color:#f5c85a; border-color:var(--accent);}
  .energy-opt.on[data-e="rosso"]{background:rgba(193,85,46,0.16); color:#e59473; border-color:var(--danger);}

  .btn-primary{
    width:100%;
    padding:15px;
    background:var(--accent);
    color:#1a1a17;
    border:none;
    border-radius:var(--radius-sm);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,system-ui,sans-serif;
    font-weight:700;
    font-size:0.95rem;
    cursor:pointer;
    letter-spacing:0.01em;
  }
  .btn-primary:active{transform:scale(0.98);}
  .btn-secondary{
    width:100%;
    padding:13px;
    background:transparent;
    color:var(--text-dim);
    border:1px solid var(--line);
    border-radius:var(--radius-sm);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,system-ui,sans-serif;
    font-weight:600;
    font-size:0.88rem;
    cursor:pointer;
    margin-top:10px;
  }

  /* Session view */
  .session-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:4px;
  }
  .session-tag{
    display:inline-block;
    font-family:ui-monospace,'SF Mono','Menlo','Roboto Mono',monospace;

      {id:'hip-thrust', name:'Hip thrust', sets:3, reps:'10', rest:90, pose:'hinge', cue:'Spingi con i talloni, contrai forte i glutei in alto, mento leggermente rientrato.', video:'hip thrust bilanciere tecnica'},
      {id:'farmers', name:'Farmer\'s carry', sets:3, reps:'30 metri', rest:60, pose:'carry', cue:'Spalle basse e indietro, core rigido come una tavola, passi corti e veloci.', video:'farmers carry tecnica esecuzione'},
      {id:'plank-ar', name:'Plank anti-rotazione', sets:3, reps:'40 sec', rest:45, pose:'plank', cue:'Bacino neutro, non far cadere i fianchi da un lato, respira senza perdere tensione.', video:'plank anti rotazione core esercizio'},
      {id:'finisher-a', name:'Finisher Zona 2 (bike/vogatore)', sets:1, reps:'10 min', rest:0, pose:'run', cue:'Ritmo blando, è recupero attivo: non deve costare fatica.', video:'allenamento zona 2 cosa significa'}

  B:{ id:'B', title:'Forza Upper', sub:'Spinta + Zona 2', mins:55,

      {id:'trazioni', name:'Trazioni o lat machine', sets:4, reps:'8', rest:90, pose:'pull', cue:'Parti da braccia completamente tese, tira portando il petto verso la sbarra.', video:'trazioni tecnica esecuzione'},
      {id:'row', name:'Row bilanciere o manubrio', sets:3, reps:'10', rest:90, pose:'pull', cue:'Schiena piatta, tira verso l\'ombelico, contrai bene le scapole in cima.', video:'bent over row tecnica esecuzione'},
      {id:'push-press', name:'Push press', sets:3, reps:'6', rest:90, pose:'press', cue:'Piccola flessione di gambe, poi spingi ed esplodi il bilanciere sopra la testa.', video:'push press tecnica esecuzione'},
      {id:'curl-bicipiti', name:'Curl bicipiti con bilanciere o manubri', sets:3, reps:'10', rest:60, pose:'pull', cue:'Gomiti fermi lungo i fianchi, sali in controllo, non dondolare la schiena per aiutarti.', video:'curl bicipiti bilanciere tecnica esecuzione'},
      {id:'cardio-b', name:'Cardio Zona 2', sets:1, reps:'15-20 min', rest:0, pose:'run', cue:'Ritmo conversazionale: se non riesci a parlare, stai andando troppo forte.', video:'allenamento zona 2 corsa'}
    ]},
  C:{ id:'C', title:'Forza Ibrida', sub:'Bilanciere e manubri, stile Hyrox ma pesante', mins:45, rounds:4,
    exercises:[
      {id:'complesso-bil', name:'Complesso bilanciere (Stacco + Row + Push Press)', sets:1, reps:'5+5+5', rest:0, pose:'hinge', cue:'Stacco da terra, poi row, poi push press: tieni il bilanciere in mano per tutta la sequenza senza appoggiarlo mai.', video:'complesso bilanciere stacco row push press tecnica'},
      {id:'farmers-c', name:'Farmer\'s carry pesante', sets:1, reps:'40 metri', rest:0, pose:'carry', cue:'Carico più pesante del solito: cammina dritto, non lasciare che le spalle cadano in avanti.', video:'farmers carry pesante tecnica esecuzione'},
      {id:'kb-swing', name:'Kettlebell swing pesante', sets:1, reps:'15', rest:0, pose:'swing', cue:'Il movimento parte dall\'anca, non dalle braccia: i glutei spingono in avanti.', video:'kettlebell swing tecnica esecuzione'},
      {id:'affondi-bil', name:'Affondi con bilanciere o manubri pesanti', sets:1, reps:'10 per gamba', rest:0, pose:'lunge', cue:'Carico pesante, passo controllato, il ginocchio dietro sfiora appena il pavimento.', video:'affondi bilanciere pesanti tecnica esecuzione'},
      {id:'row-ski', name:'Row o Ski Erg', sets:1, reps:'300 m', rest:0, pose:'run', cue:'Spinta potente dalle gambe, tira con la schiena, non solo con le braccia.', video:'vogatore tecnica esecuzione'}
    ]},
  D:{ id:'D', title:'Motore + Accessori', sub:'Zona 2 + carichi', mins:50,
    exercises:[
      {id:'cardio-d', name:'Corsa o bike Zona 2', sets:1, reps:'25-30 min', rest:0, pose:'run', cue:'Passo costante e sostenibile: il vero lavoro sul motore aerobico è qui.', video:'allenamento zona 2 costruire resistenza'},
      {id:'renegade-row', name:'Renegade row con manubri', sets:3, reps:'10 (5 per lato)', rest:60, pose:'plank', cue:'Mantieni i fianchi fermi mentre rema con un braccio: non ruotare il bacino.', video:'renegade row tecnica esecuzione'},
      {id:'suitcase-carry', name:'Suitcase carry (manubrio o kettlebell)', sets:3, reps:'30m per lato', rest:60, pose:'carry', cue:'Il core resiste alla flessione laterale: cammina dritto, non inclinarti verso il peso.', video:'suitcase carry tecnica esecuzione'},
      {id:'pallof', name:'Pallof press (cavo o elastico pesante)', sets:3, reps:'12 per lato', rest:45, pose:'press', cue:'Resisti alla rotazione, core rigido, spingi avanti e torna lento.', video:'pallof press tecnica esecuzione'},
      {id:'mobilita', name:'Mobilità anche/caviglie', sets:1, reps:'10 min', rest:0, pose:'standing', cue:'Lavoro lento e respirato, non forzare mai il range di movimento.', video:'mobilità anche caviglie esercizi'}
    ]}
};

const RECOVERY = [
  {id:'z2-rec', name:'Zona 2 leggera', sets:1, reps:'15-20 min', rest:0, pose:'run', cue:'Solo movimento leggero: oggi l\'obiettivo è recuperare, non spingere.', video:'recupero attivo allenamento leggero'},
  {id:'mob-rec', name:'Mobilità generale', sets:1, reps:'10 min', rest:0, pose:'standing', cue:'Il corpo ha già lavorato duro al turno di oggi: rispettalo.', video:'mobilità generale routine'}
];

const DAY_ORDER = ['A','B','C','D'];

/* ---------- STATO ---------- */
let state = { loads:{}, loadHistory:{}, history:[] };
let current = { dayId:null, energy:'verde', rounds:5, sessionExercises:[], setState:{} };
let timer = { seconds:90, initial:90, running:false, interval:null, label:'' };

async function loadState(){
  try{
    const raw = localStorage.getItem('centralina-data');
    if(raw){
      const parsed = JSON.parse(raw);
      state = Object.assign({loads:{}, loadHistory:{}, history:[]}, parsed);
    }
  }catch(e){
    state = { loads:{}, loadHistory:{}, history:[] };
  }
}
async function saveState(){
  try{
    localStorage.setItem('centralina-data', JSON.stringify(state));
  }catch(e){
    console.error('Errore salvataggio', e);
  }
}

/* ---------- UTIL ---------- */
function fmtDate(d){
  return d.toLocaleDateString('it-IT', {weekday:'short', day:'numeric', month:'short'});
}
function suggestedDay(){
  if(state.history.length === 0) return 'A';
  const last = state.history[state.history.length-1].dayId;
  const idx = DAY_ORDER.indexOf(last);
  return DAY_ORDER[(idx+1) % DAY_ORDER.length];
}
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 1800);
}
function allExercisesFlat(){
  let list = [];
  DAY_ORDER.forEach(k=>{
    DAYS[k].exercises.forEach(ex=> list.push(Object.assign({dayId:k}, ex)));
  });
  return list;
}
function findExercise(id){
  return allExercisesFlat().find(e=>e.id===id);
}

/* ---------- TABS ---------- */
function switchTab(name){
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  document.getElementById('view-'+name).classList.add('active');
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active', t.dataset.tab===name));
  if(name==='progressi') renderProgressi();
  if(name==='esercizi') renderEsercizi();
}
document.querySelectorAll('.tab').forEach(t=>{
  t.addEventListener('click', ()=>switchTab(t.dataset.tab));
});

/* ---------- VIEW: OGGI ---------- */
function renderOggi(){
  const grid = document.getElementById('dayGrid');
  const sug = suggestedDay();
  grid.innerHTML = DAY_ORDER.map(k=>{
    const d = DAYS[k];
    const sel = current.dayId===k ? 'selected' : '';
    const badge = (sug===k && !current.dayId) ? '<span class="badge">Consigliata</span>' : '';
    return '<button class="day-card '+sel+'" data-day="'+k+'">'+badge+
      '<span class="letter">SESSIONE '+k+' · ~'+d.mins+' min</span>'+
      '<span class="title">'+d.title+'</span>'+
      '<span class="sub">'+d.sub+'</span></button>';
  }).join('');
  grid.querySelectorAll('.day-card').forEach(c=>{
    c.addEventListener('click', ()=>{
      current.dayId = c.dataset.day;
      renderOggi();
    });
  });

  document.querySelectorAll('.energy-opt').forEach(o=>{
    o.classList.toggle('on', o.dataset.e===current.energy);
    o.onclick = ()=>{ current.energy = o.dataset.e; renderOggi(); };
  });
}
document.getElementById('startBtn').addEventListener('click', ()=>{
  if(!current.dayId){ showToast('Scegli prima una sessione'); return; }
  buildSession();
  switchTab('sessione');
});

/* ---------- SESSION BUILD ---------- */
function buildSession(){
  current.setState = {};
  if(current.energy === 'rosso'){
    current.sessionExercises = RECOVERY.map(e=>Object.assign({}, e));
    current.isRecovery = true;
  }else{
    current.isRecovery = false;
    const day = DAYS[current.dayId];
    current.sessionExercises = day.exercises.map(e=>{
      const clone = Object.assign({}, e);
      if(current.energy==='giallo' && clone.sets > 2){
        clone.sets = clone.sets - 1;
      }
      return clone;
    });
    if(current.dayId==='C'){
      current.rounds = current.energy==='giallo' ? Math.max(3, day.rounds-1) : day.rounds;
    }
  }
  renderSessione();
}

function renderSessione(){
  const c = document.getElementById('sessioneContent');
  if(!current.dayId){
    c.innerHTML = '<h1 class="page-title">Nessuna sessione avviata</h1><p class="hint">Vai su "Oggi", scegli una sessione e il tuo livello di energia, poi premi Avvia.</p>';
    return;
  }
  let html = '';
  html += '<div class="session-head"><h1 class="page-title">'+(current.isRecovery? 'Recupero':DAYS[current.dayId].title)+'</h1>'+
    '<span class="session-tag">'+energyLabel(current.energy)+'</span></div>';

  if(current.isRecovery){
    html += '<div class="notice">Livello "scarico": oggi niente carichi pesanti. Il corpo ha già dato al lavoro, questa sessione serve solo a farti recuperare meglio.</div>';
  }

  if(current.dayId==='C' && !current.isRecovery){
    html += '<div class="rounds-box"><div><div style="font-size:0.78rem;color:var(--text-dim);">Giri da completare</div><div class="n">'+current.rounds+'</div></div>'+
      '<div class="round-btns"><button id="roundMinus">−</button><button id="roundPlus">+</button></div></div>';
  }

  html += current.sessionExercises.map((ex, i)=>{
    const dots = Array.from({length:ex.sets}).map((_,si)=>{
      const key = ex.id+'_'+si;
      const done = current.setState[key];
      return '<div class="set-dot '+(done?'done':'')+'" data-key="'+key+'">'+(si+1)+'</div>';
    }).join('');
    const load = state.loads[ex.id] || '';
    return '<div class="exercise-card">'+
      '<div class="exercise-top" data-open="'+ex.id+'">'+
        '<div><div class="exercise-name">'+ex.name+'</div><div class="exercise-target mono">'+ex.sets+' × '+ex.reps+'</div></div>'+
        '<div class="info-dot">i</div>'+
      '</div>'+
      '<div class="exercise-controls">'+
        '<span class="load-unit">kg</span><input class="load-input" type="number" inputmode="decimal" value="'+load+'" data-load="'+ex.id+'">'+
        '<div class="set-dots">'+dots+'</div>'+
        (ex.rest>0 ? '<button class="timer-btn" data-timer="'+ex.rest+'" data-label="'+ex.name+'">⏱ '+ex.rest+'s</button>' : '')+
      '</div>'+
    '</div>';
  }).join('');

  html += '<button class="btn-primary end-session" id="endSessionBtn">Termina sessione</button>';
  html += '<button class="btn-secondary" id="cancelSessionBtn">Annulla</button>';

  c.innerHTML = html;

  c.querySelectorAll('[data-open]').forEach(el=>{
    el.addEventListener('click', ()=> openModal(el.dataset.open));
  });
  c.querySelectorAll('.load-input').forEach(el=>{
    el.addEventListener('change', ()=>{
      state.loads[el.dataset.load] = el.value;
      saveState();
    });
  });
  c.querySelectorAll('.set-dot').forEach(el=>{
    el.addEventListener('click', ()=>{
      current.setState[el.dataset.key] = !current.setState[el.dataset.key];
      renderSessione();
    });
  });
  c.querySelectorAll('[data-timer]').forEach(el=>{
    el.addEventListener('click', ()=> openTimer(parseInt(el.dataset.timer,10), el.dataset.label));
  });
  const rm = document.getElementById('roundMinus');
  const rp = document.getElementById('roundPlus');
  if(rm) rm.addEventListener('click', ()=>{ current.rounds = Math.max(1,current.rounds-1); renderSessione(); });
  if(rp) rp.addEventListener('click', ()=>{ current.rounds = current.rounds+1; renderSessione(); });

  document.getElementById('endSessionBtn').addEventListener('click', endSession);
  document.getElementById('cancelSessionBtn').addEventListener('click', ()=>{
    current.dayId=null; current.sessionExercises=[];
    renderOggi(); switchTab('oggi');
  });
}

function energyLabel(e){
  return e==='verde' ? 'Carica piena' : e==='giallo' ? 'A metà' : 'Scarico';
}

async function endSession(){
  const completed = Object.values(current.setState).filter(Boolean).length;
  const total = current.sessionExercises.reduce((s,e)=>s+e.sets,0);
  const entry = {
    date: new Date().toISOString(),
    dayId: current.isRecovery ? 'REC' : current.dayId,
    title: current.isRecovery ? 'Recupero' : DAYS[current.dayId].title,
    energy: current.energy,
    completed, total
  };
  state.history.push(entry);

  current.sessionExercises.forEach(ex=>{
    const v = state.loads[ex.id];
    if(v){
      if(!state.loadHistory[ex.id]) state.loadHistory[ex.id] = [];
      state.loadHistory[ex.id].push({date:new Date().toISOString(), kg:parseFloat(v)});
    }
  });

  await saveState();
  showToast('Sessione salvata');
  current.dayId = null;
  current.sessionExercises = [];
  current.setState = {};
  renderOggi();
  switchTab('progressi');
}

/* ---------- MODAL ---------- */
function openModal(exId){
  const ex = findExercise(exId) || current.sessionExercises.find(e=>e.id===exId);
  if(!ex) return;
  document.getElementById('modalPose').innerHTML = POSES[ex.pose] || POSES.standing;
  document.getElementById('modalTitle').textContent = ex.name;
  document.getElementById('modalTarget').textContent = ex.sets+' × '+ex.reps+(ex.rest>0 ? ' · recupero '+ex.rest+'s' : '');
  document.getElementById('modalCue').textContent = ex.cue;
  document.getElementById('modalVideo').href = 'https://www.youtube.com/results?search_query='+encodeURIComponent(ex.video);
  document.getElementById('modalOverlay').classList.add('active');
}
document.getElementById('modalOverlay').addEventListener('click', (e)=>{
  if(e.target.id==='modalOverlay') e.currentTarget.classList.remove('active');
});

/* ---------- TIMER ---------- */
function openTimer(seconds, label){
  clearInterval(timer.interval);
  timer.seconds = seconds;
  timer.initial = seconds;
  timer.running = false;
  timer.label = label;
  document.getElementById('timerLabel').textContent = 'Recupero · '+label;
  updateTimerDisplay();
  document.getElementById('timerStart').textContent = 'Avvia';
  document.getElementById('timerOverlay').classList.add('active');
}
function updateTimerDisplay(){
  const m = Math.floor(timer.seconds/60);
  const s = timer.seconds%60;
  document.getElementById('timerNum').textContent = String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
}
function beep(){
  try{
    const ctx = new (window.AudioContext||window.webkitAudioContext)();
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    o.connect(g); g.connect(ctx.destination);
    o.frequency.value = 880;
    g.gain.setValueAtTime(0.15, ctx.currentTime);
    o.start();
    o.stop(ctx.currentTime+0.35);
  }catch(e){}
  if(navigator.vibrate) navigator.vibrate([200,80,200]);
}
document.getElementById('timerStart').addEventListener('click', ()=>{
  if(timer.running){
    timer.running=false;
    clearInterval(timer.interval);
    document.getElementById('timerStart').textContent = 'Riprendi';
  }else{
    timer.running=true;
    document.getElementById('timerStart').textContent = 'Pausa';
    timer.interval = setInterval(()=>{
      timer.seconds--;
      if(timer.seconds<=0){
        clearInterval(timer.interval);
        timer.running=false;
        timer.seconds=0;
        updateTimerDisplay();
        beep();
        document.getElementById('timerStart').textContent = 'Avvia';
        return;
      }
      updateTimerDisplay();
    },1000);
  }
});
document.getElementById('timerReset').addEventListener('click', ()=>{
  clearInterval(timer.interval);
  timer.running=false;
  timer.seconds=timer.initial;
  updateTimerDisplay();
  document.getElementById('timerStart').textContent = 'Avvia';
});
document.getElementById('timerPlus').addEventListener('click', ()=>{ timer.seconds+=15; timer.initial+=15; updateTimerDisplay(); });
document.getElementById('timerMinus').addEventListener('click', ()=>{ timer.seconds=Math.max(15,timer.seconds-15); timer.initial=Math.max(15,timer.initial-15); updateTimerDisplay(); });
document.getElementById('timerClose').addEventListener('click', ()=>{
  clearInterval(timer.interval);
  timer.running=false;
  document.getElementById('timerOverlay').classList.remove('active');
});

/* ---------- VIEW: PROGRESSI ---------- */
function renderProgressi(){
  const totalSessions = state.history.length;
  const thisWeek = state.history.filter(h=>{
    const d = new Date(h.date);
    const now = new Date();
    const diff = (now-d)/(1000*60*60*24);
    return diff <= 7;
  }).length;
  document.getElementById('statRow').innerHTML =
    '<div class="stat-box"><span class="n">'+totalSessions+'</span><span class="l">Sessioni totali</span></div>'+
    '<div class="stat-box"><span class="n">'+thisWeek+'</span><span class="l">Questa settimana</span></div>';

  const exIds = Object.keys(state.loadHistory).filter(id=>state.loadHistory[id].length>0);
  const sel = document.getElementById('chartSelect');
  if(exIds.length===0){
    sel.style.display='none';
  }else{
    sel.style.display='block';
    sel.innerHTML = exIds.map(id=>{
      const ex = findExercise(id);
      return '<option value="'+id+'">'+(ex?ex.name:id)+'</option>';
    }).join('');
    sel.onchange = ()=>renderChart(sel.value);
    renderChart(sel.value);
  }
  if(exIds.length===0){
    document.getElementById('chartBox').innerHTML = '<div class="chart-empty">Registra un carico durante una sessione per iniziare a vedere qui la tua progressione.</div>';
  }

  const hist = state.history.slice().reverse();
  document.getElementById('historyList').innerHTML = hist.length===0
    ? '<p class="hint">Ancora nessuna sessione registrata.</p>'
    : hist.map(h=>{
        const d = new Date(h.date);
        return '<div class="history-item"><div><div class="d">'+h.title+'</div><div class="m">'+fmtDate(d)+' · '+h.completed+'/'+h.total+' set</div></div>'+
          '<span class="tag">'+energyLabel(h.energy)+'</span></div>';
      }).join('');
}

function renderChart(exId){
  const points = state.loadHistory[exId] || [];
  const box = document.getElementById('chartBox');
  if(points.length < 2){
    box.innerHTML = '<div class="chart-empty">Servono almeno 2 sessioni con carico registrato per questo esercizio.</div>';
    return;
  }
  const w=300, h=120, pad=16;
  const vals = points.map(p=>p.kg);
  const min = Math.min(...vals), max = Math.max(...vals);
  const range = (max-min) || 1;
  const stepX = (w-pad*2)/(points.length-1);
  const coords = points.map((p,i)=>{
    const x = pad + i*stepX;
    const y = h-pad - ((p.kg-min)/range)*(h-pad*2);
    return [x,y];
  });
  const path = coords.map((c,i)=>(i===0?'M':'L')+c[0].toFixed(1)+','+c[1].toFixed(1)).join(' ');
  const dots = coords.map(c=>'<circle cx="'+c[0].toFixed(1)+'" cy="'+c[1].toFixed(1)+'" r="3.5" fill="var(--accent)"/>').join('');
  const last = points[points.length-1];
  box.innerHTML = '<svg viewBox="0 0 '+w+' '+h+'" width="100%" height="'+h+'">'+
    '<path d="'+path+'" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>'+dots+
    '</svg><div style="text-align:right; font-family:ui-monospace,monospace; color:var(--text-dim); font-size:0.78rem;">ultimo: '+last.kg+' kg</div>';
}

/* ---------- VIEW: ESERCIZI ---------- */
function renderEsercizi(){
  const grid = document.getElementById('libGrid');
  grid.innerHTML = allExercisesFlat().map(ex=>{
    return '<div class="lib-item" data-open="'+ex.id+'"><span class="name">'+ex.name+'</span><span class="day">SESSIONE '+ex.dayId+'</span></div>';
  }).join('');
  grid.querySelectorAll('[data-open]').forEach(el=>{
    el.addEventListener('click', ()=>openModal(el.dataset.open));
  });
}

/* ---------- INIT ---------- */
async function init(){
  document.getElementById('topdate').textContent = fmtDate(new Date());
  await loadState();
  renderOggi();
  renderSessione();
}
init();

/* ---------- SERVICE WORKER (offline) ---------- */
/* Se il file sw.js non è raggiungibile (es. hosting a file singolo) fallisce
   in silenzio: l'app funziona comunque, solo senza cache offline garantita. */
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('./sw.js').catch(()=>{});
  });
}

})();
</script>
